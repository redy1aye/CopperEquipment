plugins {
    id 'java'
    id 'org.quiltmc.loom' version '1.4.1'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = "${project.archives_base_name}"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.quiltmc.org/repository/release/' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${project.quilted_fabric_api_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.136") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "group", project.group
    filesMatching("quilt.mod.json") {
        expand "version": project.version, "group": project.group
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}